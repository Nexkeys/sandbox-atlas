<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Sandbox Atlas: a globe (the atlas) with a dependency graph mapped across it. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#4f8ef7" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4f8ef7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#tile)"/>
  <circle cx="128" cy="128" r="104" fill="url(#glow)"/>

  <!-- Globe -->
  <g fill="none" stroke="#94a3b8" stroke-width="5">
    <circle cx="128" cy="128" r="86" stroke-opacity="0.55"/>
    <ellipse cx="128" cy="128" rx="40" ry="86" stroke-opacity="0.4"/>
    <path d="M42 128h172" stroke-opacity="0.4"/>
    <path d="M57 86h142M57 170h142" stroke-opacity="0.22"/>
  </g>

  <!-- Dependency graph -->
  <g stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" stroke-opacity="0.9">
    <path d="M128 128L82 84M128 128L180 92M128 128L90 180M128 128L176 172M180 92L176 172"/>
  </g>
  <g stroke="#0b1120" stroke-width="5">
    <circle cx="82" cy="84" r="16" fill="#3fb68b"/>
    <circle cx="180" cy="92" r="16" fill="#e5a33b"/>
    <circle cx="90" cy="180" r="16" fill="#d96ba8"/>
    <circle cx="176" cy="172" r="16" fill="#8e7cf0"/>
    <circle cx="128" cy="128" r="23" fill="#4f8ef7"/>
  </g>
  <circle cx="128" cy="128" r="9" fill="#f8fafc"/>
</svg>
